<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>쐐기의 이방인 — 베일하르트의 균열</title>
<meta name="description" content="균열로 무너져 가는 대륙 베일하르트에 떨어진 이방인의 이야기. 브라우저에서 바로 즐기는 도트 턴제 JRPG.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗡️</text></svg>">
<link rel="stylesheet" href="css/game.css">
</head>
<body>

<div id="game-wrapper">
<div id="game-container">
  <canvas id="world-canvas" width="640" height="480"></canvas>
  <div id="map-banner"></div>
  <div id="toast"></div>

  <!-- 좌상단: 리더(맵을 걷는 캐릭터) 정보 · 동료 HP/MP · 퀘스트 한 줄 -->
  <div id="hud-left" style="display:none">
    <div id="hud-main" class="ui-box">
      <div class="hud-top">
        <img id="hud-portrait" alt="">
        <div class="hud-info">
          <div class="hud-name-line"><b id="hud-name"></b><span class="lv">Lv.<span id="hud-lv">1</span></span></div>
          <div class="hud-stat"><span class="k">HP</span><span class="bar hp"><i id="hud-hp-bar"></i></span><span class="v" id="hud-hp-text"></span></div>
          <div class="hud-stat"><span class="k">MP</span><span class="bar mp"><i id="hud-mp-bar"></i></span><span class="v" id="hud-mp-text"></span></div>
        </div>
      </div>
      <div class="bar exp" title="경험치"><i id="hud-exp-bar"></i></div>
    </div>
    <div id="hud-party"></div>
    <div id="hud-quest">
      <div class="quest-line" onclick="toggleQuestList()" title="퀘스트 펼치기/접기">
        <span id="hud-quest-tag" class="tag main">메인</span><b id="hud-quest-title"></b><span id="quest-toggle">▼</span>
      </div>
      <div id="hud-quest-drop" hidden>
        <div id="hud-quest-focus"></div>
        <ul id="hud-quest-list"></ul>
      </div>
    </div>
  </div>

  <!-- 우상단: 아이콘 메뉴 (아이콘 안의 글자가 단축키) -->
  <div id="hud-right" style="display:none">
    <button class="icon-btn" title="파티 (P)" onclick="openMenu('party')"><img src="assets/img/icons/party.svg" alt=""><span class="key">P</span></button>
    <button class="icon-btn" title="가방 (I)" onclick="openMenu('items')"><img src="assets/img/icons/bag.svg" alt=""><span class="key">I</span></button>
    <button class="icon-btn" title="장비 (E)" onclick="openMenu('equip')"><img src="assets/img/icons/equip.svg" alt=""><span class="key">E</span></button>
    <button class="icon-btn" title="스킬 (K)" onclick="openMenu('skills')"><img src="assets/img/icons/skill.svg" alt=""><span class="key">K</span></button>
    <button class="icon-btn" title="퀘스트 (Q)" onclick="openMenu('quests')"><img src="assets/img/icons/quest.svg" alt=""><span class="key">Q</span></button>
    <button class="icon-btn" title="지도 (M)" onclick="openMenu('map')"><img src="assets/img/icons/map.svg" alt=""><span class="key">M</span></button>
    <button class="icon-btn" title="저장·불러오기 (F)" onclick="openSaveWindow('save')"><img src="assets/img/icons/save.svg" alt=""><span class="key">F</span></button>
    <button class="icon-btn" id="hud-mute" title="소리 켜기/끄기 (N)" onclick="hudMute()"></button>
    <button class="icon-btn" title="설정 (O · Esc)" onclick="openMenu('settings')"><img src="assets/img/icons/settings.svg" alt=""><span class="key">O</span></button>
  </div>
  <div id="autosave-mark">💾 자동 저장</div>

  <div id="dialog-box" class="ui-box" onclick="advanceDialog()">
    <img id="dialog-portrait" alt="">
    <div class="dialog-body">
      <div id="dialog-speaker"></div>
      <div id="dialog-text"></div>
    </div>
    <div id="dialog-next">▼</div>
  </div>

  <div id="modal-ui">
    <div class="modal-head"><div id="modal-title"></div><button class="mini-btn" onclick="closeModal()">✕ 닫기</button></div>
    <div id="modal-tabs"></div>
    <div id="modal-list"></div>
  </div>

  <div id="name-ui">
    <div class="name-box">
      <h2>주인공의 이름을 정해 주세요</h2>
      <p>이세계 베일하르트에서 불릴 이름입니다.</p>
      <input id="name-input" type="text" autocomplete="off" spellcheck="false">
      <button id="name-ok" class="start-btn">결정</button>
    </div>
  </div>

  <div id="battle-ui">
    <canvas id="battle-canvas" width="640" height="300"></canvas>
    <div id="battle-msg"></div>
    <div id="battle-bottom">
      <div id="battle-party"></div>
      <div id="battle-commands">
        <div id="turn-indicator"></div>
        <div id="cmd-grid"></div>
      </div>
    </div>
  </div>

  <div id="overlay-screen">
    <h1 id="ov-title">쐐기의 이방인</h1>
    <div id="ov-subtitle">베일하르트의 균열</div>
    <p id="ov-desc"></p>
    <div id="ov-menu">
      <button class="start-btn" id="ov-btn" onclick="newGame()" disabled>⚔️ 새 게임</button>
      <button class="start-btn secondary" id="ov-continue" style="display:none;" onclick="continueGame()" disabled>▶ 이어하기</button>
      <button class="start-btn ghost" id="ov-load" onclick="openSaveWindow('load')" disabled>📂 불러오기</button>
      <div class="ov-row">
        <button class="mini-btn" onclick="openTitleSettings()">⚙️ 설정</button>
        <button class="mini-btn" onclick="openAIMenu()">🤖 AI 연결</button>
        <button class="mini-btn" id="ov-login-btn" onclick="toggleLogin()" style="display:none;">🔑 Google 로그인</button>
      </div>
    </div>
    <div id="ov-scenario-status"></div>
    <button class="mini-btn" id="ov-retry" style="display:none;" onclick="boot()">🔄 다시 시도</button>
    <div id="ov-auth"><div id="ov-auth-status">☁️ 클라우드 연결 중...</div><div id="ov-pid" class="setting-row"></div></div>
  </div>

  <!-- 게임 자체 알림·확인 창 (브라우저 alert/confirm 대신) -->
  <div id="sys-dialog">
    <div class="sys-box" role="dialog" aria-modal="true">
      <div id="sys-title"></div>
      <div id="sys-msg"></div>
      <div id="sys-btns"></div>
    </div>
  </div>
</div>
</div>

<!-- PC 마우스 & 모바일 터치 겸용 가상 패드 (누르고 있으면 계속 이동) -->
<div id="virtual-pad">
  <div class="dpad">
    <div></div>
    <button class="pad-btn" data-dir="up">▲</button>
    <div></div>
    <button class="pad-btn" data-dir="left">◀</button>
    <button class="pad-btn" style="font-size:11px;" onclick="handleActionKey()">OK</button>
    <button class="pad-btn" data-dir="right">▶</button>
    <div></div>
    <button class="pad-btn" data-dir="down">▼</button>
    <div></div>
  </div>
  <div class="action-pads">
    <button class="act-btn btn-b" onclick="openMenu('party')">📋 메뉴</button>
    <button class="act-btn btn-a" onclick="handleActionKey()">💬 조사/확인</button>
  </div>
</div>

<div class="controls-hint">방향키·WASD 이동 · Space 조사/대화 · P 파티 · I 가방 · E 장비 · K 스킬 · Q 퀘스트 · M 지도 · F 저장 · N 소리 · O/Esc 설정 · 전투 중 숫자키</div>

<!-- 광고 자리 (Google AdSense 등). 광고 코드를 넣기 전까지는 게임 제목을 보여 준다. -->
<div id="ad-slot" aria-label="광고 영역"><span class="ad-title">쐐기의 이방인</span><span class="ad-sub">베일하르트의 균열</span></div>

<!-- 스크립트 로드 순서가 곧 의존 순서다. (docs/08_tech.md 참고) -->
<script src="js/config.js"></script>
<script src="js/core/assets.js"></script>
<script src="js/core/state.js"></script>
<script src="js/core/audio.js"></script>
<script src="js/core/ui.js"></script>
<script src="js/core/display.js"></script>
<script src="js/ai/ai-client.js"></script>
<script src="js/scenario/crypto.js"></script>
<script src="js/scenario/format.js"></script>
<script src="js/scenario/context.js"></script>
<script src="js/scenario/runtime.js"></script>
<script src="js/world/world.js"></script>
<script src="js/systems/hud.js"></script>
<script src="js/systems/worldmap.js"></script>
<script src="js/systems/shop.js"></script>
<script src="js/systems/battle-view.js"></script>
<script src="js/systems/battle.js"></script>
<script src="js/systems/save.js"></script>
<script src="js/game/input.js"></script>
<script src="js/game/main.js"></script>
<script type="module" src="js/firebase/game-cloud.js"></script>
</body>
</html>
