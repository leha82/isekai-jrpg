<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>아르카디아 연대기 - 이세계 전생 JRPG</title>
<meta name="description" content="브라우저에서 바로 즐기는 8비트 도트 이세계 전생 턴제 JRPG. 3인 파티로 마왕성의 진실에 다가가세요.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
<link rel="stylesheet" href="css/game.css">
</head>
<body>

<div id="game-wrapper">
<div id="game-container">
  <canvas id="world-canvas" width="640" height="480"></canvas>

  <div id="toast"></div>

  <div id="hud" class="ui-box">
    <div id="party-status"></div>
    <div class="gold-bar">
      <span>💰 <span id="p-gold">60</span> G</span>
      <span>Lv.<span id="p-lv">1</span> (EXP <span id="p-exp">0</span>/<span id="p-nextexp">20</span>)</span>
    </div>
  </div>

  <div id="quest-box" class="ui-box">
    <strong>[현재 목표]</strong><br>
    <span id="quest-text"></span>
  </div>

  <div id="top-controls">
    <button class="mini-btn" onclick="openInventory()">🎒 가방(I)</button>
    <button class="mini-btn" id="bgm-btn" onclick="toggleAudio()">🔊 소리 ON</button>
    <button class="mini-btn" onclick="manualSave()">💾 저장</button>
    <button class="mini-btn" onclick="manualLoad()">📂 불러오기</button>
    <button class="mini-btn" id="auth-btn" onclick="toggleLogin()">☁️ 연결 중...</button>
  </div>

  <div id="dialog-box" class="ui-box" onclick="advanceDialog()">
    <div>
      <div id="dialog-speaker">시스템</div>
      <div id="dialog-text">텍스트</div>
    </div>
    <div id="dialog-next">▼ [Space / 확인 버튼] 계속</div>
  </div>

  <div id="modal-ui">
    <div id="modal-title">상점 / 인벤토리</div>
    <div id="modal-list"></div>
    <button class="start-btn" style="padding:7px; font-size:13px;" onclick="closeModal()">닫기</button>
  </div>

  <div id="battle-ui">
    <div id="battle-stage">
      <div id="party-sprites"></div>
      <div id="enemy-area">
        <canvas id="enemy-canvas" width="16" height="16"></canvas>
        <div id="enemy-info">
          <strong id="e-name">슬라임</strong> | HP: <span id="e-hp">20</span>/<span id="e-maxhp">20</span>
        </div>
      </div>
    </div>
    <div id="battle-bottom">
      <div id="battle-log"></div>
      <div id="battle-commands">
        <div id="turn-indicator">유진의 차례</div>
        <div id="cmd-grid"></div>
      </div>
    </div>
  </div>

  <div id="overlay-screen">
    <h1 id="ov-title">아르카디아 연대기</h1>
    <p id="ov-desc">이세계 전생 JRPG</p>
    <button class="start-btn" id="ov-btn" onclick="startGame()" disabled>모험 시작하기</button>
    <button class="start-btn secondary" id="ov-continue" style="display:none;" onclick="continueGame()" disabled>📂 이어하기</button>
    <div id="ov-scenario-status"></div>
    <button class="mini-btn" id="ov-retry" style="display:none;" onclick="bootScenario()">🔄 다시 시도</button>
    <div id="ov-auth">
      <button class="mini-btn" id="ov-login-btn" onclick="toggleLogin()" style="display:none;">🔑 Google 로그인</button>
      <div id="ov-auth-status">☁️ 클라우드 연결 중...</div>
    </div>
  </div>
</div>
</div>

<!-- PC 마우스 & 모바일 터치 겸용 가상 패드 -->
<div id="virtual-pad">
  <div class="dpad">
    <div></div>
    <button class="pad-btn" onclick="movePlayer(0, -1)">▲</button>
    <div></div>
    <button class="pad-btn" onclick="movePlayer(-1, 0)">◀</button>
    <button class="pad-btn" style="font-size:11px;" onclick="handleActionKey()">OK</button>
    <button class="pad-btn" onclick="movePlayer(1, 0)">▶</button>
    <div></div>
    <button class="pad-btn" onclick="movePlayer(0, 1)">▼</button>
    <div></div>
  </div>
  <div class="action-pads">
    <button class="act-btn btn-b" onclick="openInventory()">🎒 가방 (I)</button>
    <button class="act-btn btn-a" onclick="handleActionKey()">💬 조사/확인</button>
  </div>
</div>

<div class="controls-hint">PC 키보드(방향키/WASD, Space, I) 및 하단 터치 버튼 모두 사용 가능</div>

<!-- 스크립트 로드 순서가 곧 의존 순서다. (docs/08_tech.md 참고) -->
<script src="js/config.js"></script>
<script src="js/data/sprites.js"></script>
<script src="js/data/world.js"></script>
<script src="js/data/actors.js"></script>
<script src="js/core/state.js"></script>
<script src="js/core/audio.js"></script>
<script src="js/core/ui.js"></script>
<script src="js/core/render.js"></script>
<script src="js/scenario/crypto.js"></script>
<script src="js/scenario/format.js"></script>
<script src="js/scenario/context.js"></script>
<script src="js/scenario/runtime.js"></script>
<script src="js/systems/shop.js"></script>
<script src="js/systems/battle.js"></script>
<script src="js/systems/save.js"></script>
<script src="js/game/input.js"></script>
<script src="js/game/main.js"></script>
<script type="module" src="js/firebase/game-cloud.js"></script>
</body>
</html>
